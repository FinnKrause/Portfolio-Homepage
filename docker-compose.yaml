services:
  homepage:
    container_name: finn-homepage
    build:
      context: .
      dockerfile: Dockerfile
    image: finn-homepage:latest
    restart: unless-stopped

    # Values come from .env in this directory, which docker compose reads
    # automatically. Each has a fallback, so a missing .env still starts.
    # `cp .env.example .env` and edit that rather than editing this file.
    ports:
      # Host FK_HOST_PORT -> container 3000. Only the reverse proxy in front of
      # this may reach it; see docs/operations.md.
      #
      # If — and only if — that proxy runs on the host itself rather than in its
      # own container, tighten this to "127.0.0.1:8070:3000". That stops the app
      # being reachable from outside the machine even if the firewall is wrong,
      # which matters because /admin has no authentication of its own and now
      # carries a read/write SQL console. Do not change it blind: a containerised
      # proxy cannot reach a port bound to the host loopback.
      - "${FK_HOST_PORT:-8070}:3000"

    environment:
      # The container path, and the one place it should be set. It is commented
      # out in .env on purpose: Next.js loads .env on the host too, so a value
      # written for the container would also point `npm run dev` at /app/data
      # and break every database route locally. The fallback here is what the
      # deployment actually runs on.
      FK_DB_PATH: ${FK_DB_PATH:-/app/data/access.db}
      # Must be the origin visitors actually use. It is baked into printed QR
      # codes and links copied out of /admin, and the app cannot discover it:
      # a route handler derives its origin from the container's own listening
      # address, not from the Host header the proxy forwards.
      FK_PUBLIC_ORIGIN: ${FK_PUBLIC_ORIGIN:-}
      TZ: ${TZ:-Europe/Berlin}

    volumes:
      # A bind mount to ./data on the host, not a named volume. The database is
      # the only irreplaceable thing here — every code you have handed out lives
      # in it — and a bind mount means you can see it, back it up with cp, and
      # copy it to another machine without knowing anything about Docker's
      # internal volume store. `docker compose down -v` cannot take it with it.
      #
      # ./data is gitignored. The redeploy script creates it if it is missing.
      - ${FK_DATA_DIR:-./data}:/app/data

    healthcheck:
      # Matches the HEALTHCHECK in the Dockerfile; repeated here so `docker
      # compose ps` reports health even if the image is ever built elsewhere.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/impressum',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      # Without this, container logs grow without bound and are the usual way a
      # small VPS runs out of disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
